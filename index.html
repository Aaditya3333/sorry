<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm Sorry Anugya ❤️</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="heart-bg"></div>
        
        <div class="content-wrapper">
            <div class="floating-hearts" id="floatingHearts"></div>
            
            <div class="main-content fade-in">
                <h1 class="title">I'm Sorry Anugya ❤️</h1>
                
                <div class="photo-container">
                    <img src="1.jpeg" alt="Anugya" class="profile-photo">
                </div>
                
                <div class="message-box">
                    <p class="message" id="message"></p>
                </div>
                
                <div class="buttons mt-5">
                    <button class="btn btn-yes" id="yesBtn">I Forgive You 💕</button>
                    <button class="btn btn-no" id="noBtn">Not Yet 😢</button>
                </div>
                
                <div class="hidden-message" id="hiddenMessage">
                    <h2 class="thank-you">Thank You! 🥰</h2>
                    <p class="love-note">I promise to make it up to you!</p>
                    <div class="heart-beat">❤️</div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
